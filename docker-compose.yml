services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - .volumes/pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - shared_network

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - shared_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      DB_HOST: postgres
    entrypoint: ["sh", "-c"]
    command:
      - atlas migrate apply --dir file:///app/migration/versions/dev --url "postgres://$${DB_USER}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?sslmode=$${DB_SSLMODE}"
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - shared_network

  seed-users:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      DB_HOST: postgres
    command: ["--mode", "seed-users"]
    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - shared_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      DB_HOST: postgres
      REDIS_ADDRESS: redis:6379
    ports:
      - "8080:8080"
    command: ["--mode", "http"]
    depends_on:
      seed-users:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    networks:
      - shared_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./.env
    environment:
      DB_HOST: postgres
      REDIS_ADDRESS: redis:6379
    command: ["--mode", "async"]
    depends_on:
      seed-users:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    networks:
      - shared_network


networks:
  shared_network:
    driver: bridge
